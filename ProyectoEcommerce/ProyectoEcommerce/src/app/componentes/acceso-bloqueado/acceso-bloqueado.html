<main class="blocked-shell"><section class="blocked-card" aria-labelledby="blocked-title"><div class="lock" aria-hidden="true">!</div><span class="eyebrow">Acceso bloqueado</span><h1 id="blocked-title">Demasiados intentos</h1><p>Se alcanzó el límite de intentos permitidos. Intenta nuevamente más tarde.</p>@if (segundos > 0) { <div class="countdown"><span>Tiempo aproximado restante</span><strong>{{ tiempo }}</strong></div> } @else { <div class="alert alert-success">Ya puedes volver a intentarlo.</div> }<button class="btn btn-primary" type="button" [disabled]="segundos > 0" (click)="volver()">Volver a iniciar sesión</button></section></main>
